<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PROTOTYPE — Web client (ticket #21)</title>
<!--
  PROTOTYPE — throwaway. Answers "what does the web client look like on a
  phone and on a desktop browser?" (ticket #21).

  DEFAULT MODE IS `auto` — the decided answer. It fills the real viewport,
  detects orientation with a real media query, and swaps layout live on
  rotation:

      portrait  -> C (continuous log)     [chosen]
      landscape -> D (split rail)         [chosen]

  ?variant=A..F still forces a single layout inside a simulated device
  frame, kept so the rejected alternatives stay comparable.

  Simulates the real SSE vocabulary from ticket #18: start / delta{text} /
  done{usage} / error{kind} / sync{text}.
-->
<style>
  :root {
    --bg: #0b0d10;
    --panel: #14171c;
    --panel-2: #1b1f26;
    --border: #262b33;
    --text: #e7e9ec;
    --text-dim: #8b93a1;
    --accent: #5b9dff;
    --green: #3ecf8e;
    --amber: #e0a740;
    --red: #e0575c;
    --code-bg: #0e1013;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

  /* ---- auto mode: fill the real viewport, no fake frame ---- */
  #device.auto { width: 100%; padding: 0; }
  #device.auto #frame {
    width: 100vw; height: 100vh; height: 100dvh;
    border: none; border-radius: 0;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* ---- framed mode: simulated device, for comparing A–F ---- */
  #device { width: 100%; display: flex; justify-content: center; padding: 20px 0 90px; }
  #frame {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden; position: relative;
    display: flex; flex-direction: column;
    width: 720px; height: 640px;
  }
  #device.portrait.phone  #frame { width: 390px;  height: 780px; border-radius: 28px; }
  #device.portrait.wide   #frame { width: 720px;  height: 800px; }
  #device.landscape.phone #frame { width: 844px;  height: 390px; border-radius: 24px; }
  #device.landscape.wide  #frame { width: 1200px; height: 620px; }

  h1, h2, h3 { margin: 0; }
  code, pre { font-family: "SF Mono", Consolas, "Cascadia Code", monospace; }

  .muted { color: var(--text-dim); }
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.connected { background: var(--green); }
  .dot.reconnecting { background: var(--amber); animation: pulse 1s infinite; }
  .dot.disconnected { background: var(--red); }
  .dot.history { background: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .answer-heading { font-size: 20px; font-weight: 650; margin: 0 0 10px; line-height: 1.3; }
  .missing-line { font-size: 13px; color: var(--amber); background: rgba(224,167,64,.08); border-left: 2px solid var(--amber); padding: 6px 10px; border-radius: 4px; margin-bottom: 12px; }
  .error-line { font-size: 13px; color: var(--red); background: rgba(224,87,92,.08); border-left: 2px solid var(--red); padding: 6px 10px; border-radius: 4px; margin-top: 10px; }
  .code-wrap { background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; }
  .code-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 10px; font-size: 11px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  pre.code-body { margin: 0; padding: 12px 14px; font-size: 13px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
  pre.code-body.no-wrap { white-space: pre; word-break: normal; overflow-x: auto; }
  .wrap-toggle { font-size: 11px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text-dim); border-radius: 999px; padding: 2px 8px; cursor: pointer; }
  .wrap-toggle:hover { color: var(--text); }
  .prose p { font-size: 13.5px; line-height: 1.6; color: #cdd2da; margin: 0 0 10px; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--accent); vertical-align: text-bottom; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .usage-line { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .sync-tag { font-size: 11px; color: var(--accent); background: rgba(91,157,255,.1); display: inline-block; padding: 2px 8px; border-radius: 999px; margin-bottom: 8px; }
  .interrupted-tag { font-size: 10px; color: var(--text-dim); border: 1px solid var(--border); padding: 1px 6px; border-radius: 999px; margin-left: 8px; white-space: nowrap; }
  .back-to-live { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; background: var(--accent); color: #06111f; border: none; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 600; }

  .hist-item { padding: 10px 8px; border-bottom: 1px solid var(--border); cursor: pointer; }
  .hist-item:hover { background: var(--panel-2); }
  .hist-item .t { font-size: 13.5px; font-weight: 600; }
  .hist-item .m { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

  /* icon buttons + FAB stack (fullscreen / settings) */
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; color: var(--text-dim); font-size: 15px; flex: none; }
  .icon-btn:hover { background: var(--border); color: var(--text); }
  .icon-btn.disabled { opacity: .35; cursor: not-allowed; }
  .fab-stack { position: absolute; bottom: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px; z-index: 5; }
  .fab {
    width: 40px; height: 40px; border-radius: 50%; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text-dim); display: flex;
    align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
    box-shadow: 0 2px 10px rgba(0,0,0,.35);
  }
  .fab:hover { color: var(--text); border-color: var(--accent); }
  .fab.disabled { opacity: .35; cursor: not-allowed; }

  .overlay { position: absolute; inset: 0; background: var(--panel); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; z-index: 10; }
  .overlay.open { transform: translateX(0); }
  .overlay-header { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .overlay-header .back { cursor: pointer; color: var(--text-dim); font-size: 15px; }
  .overlay-body { flex: 1; overflow-y: auto; padding: 8px 14px; }

  /* ============ A — bottom sheet history (portrait, rejected) ============ */
  #vA { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #vA .top-bar { padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; background: linear-gradient(180deg, var(--panel-2), var(--panel)); }
  #vA .pane { flex: 1; overflow-y: auto; padding: 16px; }
  #vA .always-on-top-note { font-size: 11px; color: var(--text-dim); text-align: center; padding: 10px 20px 4px; }
  #vA .history-tab { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel-2); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13px; }
  #vA .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--panel); border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; overflow: hidden; transition: height .28s ease; display: flex; flex-direction: column; box-shadow: 0 -10px 30px rgba(0,0,0,.4); }
  #vA .sheet.open { height: 72%; }
  #vA .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 999px; margin: 8px auto; cursor: pointer; }
  #vA .sheet-header { display: flex; justify-content: space-between; padding: 0 16px 8px; font-size: 13px; color: var(--text-dim); }
  #vA .sheet-list { overflow-y: auto; padding: 0 12px 16px; }

  /* ============ B — header stack + overlay (portrait, rejected) ============ */
  #vB { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #vB .header { height: 42px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  #vB .header .title-trunc { flex: 1; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vB .pane { flex: 1; overflow-y: auto; padding: 16px; }

  /* ============ C — continuous log (PORTRAIT, CHOSEN) ============ */
  #vC { flex: 1; overflow-y: auto; padding: 14px 14px 78px; min-height: 0; }
  .conn-banner { font-size: 12px; text-align: center; padding: 6px; border-radius: 8px; margin-bottom: 10px; background: rgba(224,167,64,.1); color: var(--amber); border: 1px solid rgba(224,167,64,.3); }
  .conn-banner.disconnected { background: rgba(224,87,92,.1); color: var(--red); border-color: rgba(224,87,92,.3); }
  .entry { background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .entry.live { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(91,157,255,.25); }
  .entry.collapsed .code-wrap, .entry.collapsed .prose, .entry.collapsed .answer-heading,
  .entry.collapsed .missing-line, .entry.collapsed .usage-line, .entry.collapsed .sync-tag,
  .entry.collapsed .error-line { display: none; }
  .entry.collapsed { cursor: pointer; opacity: .82; }
  .entry.collapsed:hover { opacity: 1; }
  .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .entry .ts { font-size: 11px; color: var(--text-dim); flex: none; }

  /* ============ D — split rail (LANDSCAPE, CHOSEN) ============ */
  /* rail narrowed from 220px -> 132px: at 844px wide it was eating 26% of the
     viewport for a list that is mostly empty in a short session. */
  #vD { flex: 1; display: flex; min-height: 0; }
  #vD .rail { width: 132px; flex: none; border-right: 1px solid var(--border); background: var(--panel-2); display: flex; flex-direction: column; min-height: 0; }
  #vD .rail-top { padding: 8px 9px; border-bottom: 1px solid var(--border); }
  #vD .rail-top .pill { padding: 0; font-size: 11px; }
  #vD .rail-list { flex: 1; overflow-y: auto; padding: 5px 6px; }
  #vD .rail-card { padding: 7px 8px; border-radius: 7px; cursor: pointer; margin-bottom: 5px; border: 1px solid transparent; }
  #vD .rail-card:hover { background: var(--panel); }
  #vD .rail-card.active { background: var(--panel); border-color: var(--accent); }
  #vD .rail-card .t {
    font-size: 11.5px; font-weight: 600; line-height: 1.3;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  #vD .rail-card .m { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  #vD .rail-card.is-live .t { color: var(--accent); }
  #vD .rail-card .int-dot { color: var(--text-dim); font-size: 9.5px; }
  #vD .rail-footer { flex: none; border-top: 1px solid var(--border); padding: 5px; display: flex; justify-content: space-around; }
  #vD .main { flex: 1; overflow-y: auto; padding: 14px 18px; min-width: 0; }

  /* ============ E — code | prose columns (landscape, rejected) ============ */
  #vE { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #vE .strip { height: 36px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  #vE .strip .title-trunc { flex: 1; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vE .cols { flex: 1; display: flex; min-height: 0; }
  #vE .col-code { flex: 1.35; min-width: 0; overflow-y: auto; padding: 12px; border-right: 1px solid var(--border); }
  #vE .col-prose { flex: 1; min-width: 0; overflow-y: auto; padding: 12px 14px; }
  #vE .col-label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  #vE .code-wrap { margin-bottom: 0; }

  /* ============ F — horizontal filmstrip (landscape, rejected) ============ */
  #vF { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #vF .strip-top { flex: none; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--panel-2); }
  #vF .film { flex: 1; display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; padding: 12px; scroll-snap-type: x mandatory; min-height: 0; }
  #vF .card { width: 340px; flex: none; scroll-snap-align: start; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 13px; overflow-y: auto; }
  #vF .card.live { border-color: var(--accent); box-shadow: 0 0 0 1px rgba(91,157,255,.25); }
  #vF .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  #vF .card-top .ts { font-size: 10.5px; color: var(--text-dim); flex: none; }

  /* ---- prototype chrome (not part of the design under test) ---- */
  #proto-toggle {
    position: fixed; top: 8px; left: 8px; z-index: 60; background: #000c; color: var(--text-dim);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 10.5px;
    cursor: pointer; backdrop-filter: blur(6px);
  }
  #proto-toggle.forced { color: var(--amber); border-color: var(--amber); }
  #controls { position: fixed; top: 40px; left: 8px; z-index: 60; background: #000d; border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 11.5px; display: flex; flex-direction: column; gap: 6px; width: 186px; backdrop-filter: blur(6px); max-height: 78vh; overflow-y: auto; }
  #controls .title { font-weight: 700; letter-spacing: .04em; color: var(--text-dim); }
  #controls button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; cursor: pointer; font-size: 11px; text-align: left; }
  #controls button:hover { border-color: var(--accent); }
  #controls .hint { color: var(--text-dim); font-size: 10px; line-height: 1.45; }
  #controls .readout { color: var(--accent); font-size: 10px; line-height: 1.45; border-top: 1px solid var(--border); padding-top: 6px; }
  #switcher { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 60; background: #000d; border: 1px solid var(--border); border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 6px 12px; backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.4); }
  #switcher button { background: none; border: none; color: var(--text); font-size: 15px; cursor: pointer; padding: 2px 6px; }
  #switcher .label { font-size: 11.5px; min-width: 200px; text-align: center; }
  #switcher .label b { color: var(--accent); }
  #switcher .orient { font-size: 9.5px; color: var(--text-dim); }
  .proto-hidden { display: none !important; }
</style>
</head>
<body>

<div id="device"><div id="frame"></div></div>

<div id="proto-toggle">proto ▾</div>

<div id="controls">
  <div class="title">PROTOTYPE CONTROLS</div>
  <button data-act="new">New answer (interrupt)</button>
  <button data-act="error">Simulate error</button>
  <button data-act="disconnect">Simulate disconnect</button>
  <button data-act="reconnect">Simulate reconnect</button>
  <button data-act="sync">Simulate mid-stream join</button>
  <button data-act="width">Toggle framed phone / desktop</button>
  <button data-act="reset">Reset</button>
  <div class="hint">AUTO fills the real viewport and switches layout on rotation. A–F force one layout in a simulated frame.</div>
  <div class="readout" id="readout"></div>
</div>

<div id="switcher">
  <button data-nav="-1">←</button>
  <div class="label" id="switcher-label"></div>
  <button data-nav="1">→</button>
</div>

<script>
/* ---------- demo data ---------- */
const DEMO = [
  {
    title: "Sum of Positive",
    lang: "javascript",
    code: `function sumPositive(numbers) {\n  return numbers.reduce((total, n) => (n > 0 ? total + n : total), 0);\n}`,
    prose: [
      "A single left-to-right pass, adding each element only when it is positive. reduce seeded with 0 also gives the right answer for an empty array and for an array with no positive values, both of which the notes call out.",
      "O(n) time, O(1) extra space."
    ],
    usage: { input: 342, output: 287 }
  },
  {
    title: "Two Sum",
    lang: "python",
    code: `def two_sum(nums, target):\n    seen = {}\n    for i, n in enumerate(nums):\n        if target - n in seen:\n            return [seen[target - n], i]\n        seen[n] = i`,
    prose: [
      "One pass with a hash map from value to index. For each number, check whether its complement has already been seen before inserting the current number.",
      "O(n) time, O(n) space."
    ],
    usage: { input: 298, output: 264 }
  },
  {
    title: "Valid Parentheses",
    lang: "javascript",
    code: `function isValid(s) {\n  const pairs = { ')': '(', ']': '[', '}': '{' };\n  const stack = [];\n  for (const ch of s) {\n    if (ch in pairs) {\n      if (stack.pop() !== pairs[ch]) return false;\n    } else {\n      stack.push(ch);\n    }\n  }\n  return stack.length === 0;\n}`,
    prose: [
      "A stack tracks open brackets. Every closing bracket must match the most recently opened one, which a stack pop checks directly; a leftover stack at the end means an unclosed bracket.",
      "O(n) time, O(n) space worst case."
    ],
    usage: { input: 276, output: 241 }
  },
  {
    title: "Merge Intervals",
    lang: "python",
    missing: "the exact tie-breaking rule when two intervals touch at a single point — assumed touching endpoints merge.",
    code: `def merge(intervals):\n    intervals.sort(key=lambda iv: iv[0])\n    merged = []\n    for start, end in intervals:\n        if merged and start <= merged[-1][1]:\n            merged[-1][1] = max(merged[-1][1], end)\n        else:\n            merged.append([start, end])\n    return merged`,
    prose: [
      "Sorting by start turns overlap-checking into a single pass: an interval only needs to be compared against the most recently merged one.",
      "O(n log n) time for the sort, O(n) space for the output."
    ],
    usage: { input: 305, output: 251 }
  }
];

/* ---------- state ---------- */
const S = {
  mode: "auto",                 // "auto" | "A".."F"
  wide: false,
  socket: "connected",
  history: [
    { ...DEMO[0], ts: "14 min ago", interrupted: false },
    { ...DEMO[1], ts: "6 min ago", interrupted: true }
  ],
  live: null,
  paneMode: "live",
  historyViewIndex: null,
  sheetOpen: false,
  overlayOpen: null,
  wrapCode: true,
  demoCursor: 2,
  streamTimer: null,
  protoChromeOpen: true
};

const LANDSCAPE_VARIANTS = ["D", "E", "F"];
const ORDER = ["auto", "A", "B", "C", "D", "E", "F"];
const NAMES = {
  auto: "AUTO — C portrait / D landscape",
  A: "Bottom sheet history", B: "Header + overlay", C: "Continuous log",
  D: "Split rail", E: "Code | prose columns", F: "Horizontal filmstrip"
};

/* Real orientation detection.

   Source of truth is a direct dimension comparison, not the media query —
   matchMedia is used only as one of several change *triggers*. A compound
   query is one more thing that can silently not match; innerWidth vs
   innerHeight cannot.

   Landscape layout also needs enough width to justify a rail, so a small
   landscape *window* on a desktop still reads better as the log. The floor
   is 480px so that every phone in landscape (iPhone SE is 568px, the
   narrowest in practice) clears it. */
const LANDSCAPE_MIN_WIDTH = 480;
const mqLandscape = window.matchMedia("(orientation: landscape)");

function orientationIsLandscape() {
  return window.innerWidth > window.innerHeight && window.innerWidth >= LANDSCAPE_MIN_WIDTH;
}

const params = new URLSearchParams(location.search);
const requested = params.get("variant");
if (requested) {
  const r = requested.toLowerCase() === "auto" ? "auto" : requested.toUpperCase();
  if (ORDER.includes(r)) S.mode = r;
}

function effectiveVariant() {
  return S.mode === "auto" ? (orientationIsLandscape() ? "D" : "C") : S.mode;
}
function isAuto() { return S.mode === "auto"; }

/* ---------- fullscreen ---------- */
const fsEl = document.documentElement;
function fsSupported() {
  return !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
}
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function toggleFullscreen() {
  if (!fsSupported()) return;
  if (isFullscreen()) {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  } else {
    (fsEl.requestFullscreen || fsEl.webkitRequestFullscreen).call(fsEl);
  }
}
function fsIcon() { return isFullscreen() ? "⤢" : "⛶"; }
function fsTitle() {
  if (!fsSupported()) return "Fullscreen not supported by this browser (iPhone Safari has no Fullscreen API)";
  return isFullscreen() ? "Exit fullscreen" : "Fullscreen";
}

/* ---------- streaming engine ---------- */
function stopStream() { if (S.streamTimer) { clearInterval(S.streamTimer); S.streamTimer = null; } }
function fullText(demo) { return (demo.missing || "") + demo.code + demo.prose.join(""); }

function startAnswer(demo, opts = {}) {
  stopStream();
  if (S.live && (S.live.state === "streaming" || S.live.state === "syncing")) {
    S.history.unshift({ ...S.live, interrupted: true, ts: "just now" });
  } else if (S.live && (S.live.state === "done" || S.live.state === "error")) {
    S.history.unshift({ ...S.live, interrupted: false, ts: "just now" });
  }
  S.paneMode = "live"; S.historyViewIndex = null; S.sheetOpen = false; S.overlayOpen = null;

  const len = fullText(demo).length;
  S.live = {
    ...demo,
    state: opts.syncFrom ? "syncing" : "streaming",
    revealed: opts.syncFrom ? Math.floor(len * opts.syncFrom) : 0,
    fullLen: len, ts: "just now"
  };
  render();

  if (opts.syncFrom) setTimeout(() => { if (S.live) { S.live.state = "streaming"; render(); } }, 600);

  S.streamTimer = setInterval(() => {
    if (!S.live) return stopStream();
    S.live.revealed = Math.min(S.live.fullLen, S.live.revealed + 4);
    if (S.live.revealed >= S.live.fullLen) { S.live.state = "done"; stopStream(); }
    render();
  }, 22);
}

/* Split the revealed character count back into the answer's real parts.
   Paragraphs are tracked by offset so streaming never merges or splits them. */
function revealedParts(demo, revealed) {
  const missingLen = demo.missing ? demo.missing.length : 0;
  const codeLen = demo.code.length;
  const missingDone = Math.min(revealed, missingLen);
  const codeDone = Math.min(Math.max(revealed - missingLen, 0), codeLen);

  let proseAvail = Math.max(revealed - missingLen - codeLen, 0);
  const proseParas = [];
  for (const p of demo.prose) {
    if (proseAvail <= 0) break;
    proseParas.push(p.slice(0, Math.min(proseAvail, p.length)));
    proseAvail -= p.length;
  }
  return {
    missing: demo.missing ? demo.missing.slice(0, missingDone) : "",
    missingComplete: missingDone >= missingLen,
    code: demo.code.slice(0, codeDone),
    codeComplete: codeDone >= codeLen,
    prose: proseParas
  };
}

function simulateError() {
  stopStream();
  if (S.live) { S.live.state = "error"; S.live.errorKind = "overloaded"; }
  render();
}

/* ---------- shared render helpers ---------- */
function escapeHtml(s) { return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function connLabel() {
  if (S.paneMode === "history") return { cls: "history", text: "Viewing history — not live" };
  return socketLabel();
}

/* Socket state alone, ignoring which answer is being *viewed*. C needs this:
   it has no live/history split, so its live entry is live no matter what
   else is expanded below it. */
function socketLabel() {
  if (S.socket === "reconnecting") return { cls: "reconnecting", text: "Reconnecting…" };
  if (S.socket === "disconnected") return { cls: "disconnected", text: "Disconnected" };
  return { cls: "connected", text: "Connected" };
}

function partsOf(entry) {
  return entry.revealed !== undefined
    ? revealedParts(entry, entry.revealed)
    : { missing: entry.missing || "", missingComplete: true, code: entry.code, codeComplete: true, prose: entry.prose };
}

function codeBlockHtml(entry, parts, showCursor) {
  const cursorInCode = showCursor && entry.revealed !== undefined && !parts.codeComplete;
  return `<div class="code-wrap">
    <div class="code-head">
      <span>${entry.lang}</span>
      <span class="wrap-toggle" data-toggle-wrap="1">${S.wrapCode ? "wrap: on" : "wrap: off"}</span>
    </div>
    <pre class="code-body ${S.wrapCode ? "" : "no-wrap"}">${escapeHtml(parts.code)}${cursorInCode ? '<span class="cursor"></span>' : ''}</pre>
  </div>`;
}

function proseHtml(entry, parts, showCursor) {
  const streaming = entry.revealed !== undefined && entry.state !== "done" && entry.state !== "error";
  const cursorInProse = showCursor && streaming && parts.codeComplete;
  if (!parts.prose.length) return cursorInProse ? `<div class="prose"><p><span class="cursor"></span></p></div>` : "";
  return `<div class="prose">` + parts.prose.map((p, i) =>
    `<p>${escapeHtml(p)}${cursorInProse && i === parts.prose.length - 1 ? '<span class="cursor"></span>' : ''}</p>`
  ).join("") + `</div>`;
}

function tailHtml(entry) {
  if (entry.state === "error") return `<div class="error-line"><b>error:</b> ${entry.errorKind || "unknown"} — the call failed mid-stream. Partial answer above is preserved.</div>`;
  if (entry.state === "done" || entry.revealed === undefined) return `<div class="usage-line">${entry.usage.input} in · ${entry.usage.output} out</div>`;
  return "";
}

function answerBlockHtml(entry, { showCursor, interrupted, showHeading = true }) {
  if (!entry) return `<div class="muted" style="font-size:13px;">No answer yet.</div>`;
  const parts = partsOf(entry);
  let html = "";
  if (showHeading) html += `<div class="answer-heading">${escapeHtml(entry.title)}${interrupted ? '<span class="interrupted-tag">interrupted</span>' : ''}</div>`;
  if (entry.state === "syncing") html += `<div class="sync-tag">syncing…</div>`;
  if (parts.missing) {
    const c = showCursor && entry.revealed !== undefined && !parts.missingComplete;
    html += `<div class="missing-line"><b>Missing:</b> ${escapeHtml(parts.missing)}${c ? '<span class="cursor"></span>' : ''}</div>`;
  }
  html += codeBlockHtml(entry, parts, showCursor);
  html += proseHtml(entry, parts, showCursor);
  html += tailHtml(entry);
  return html;
}

function historyRowHtml(entry, i) {
  return `<div class="hist-item" data-open-history="${i}">
    <div class="t">${escapeHtml(entry.title)}${entry.interrupted ? '<span class="interrupted-tag">interrupted</span>' : ''}</div>
    <div class="m">${entry.ts} · ${entry.usage.input + entry.usage.output} tok</div>
  </div>`;
}

function currentDisplayEntry() {
  if (S.paneMode === "history" && S.historyViewIndex !== null) return S.history[S.historyViewIndex];
  return S.live;
}

function overlaysHtml() {
  return `<div class="overlay ${S.overlayOpen === 'history' ? 'open' : ''}">
      <div class="overlay-header"><span class="back" data-close-overlay="1">←</span><span>History</span></div>
      <div class="overlay-body">${S.history.map(historyRowHtml).join("") || '<div class="muted">No past answers yet.</div>'}</div>
    </div>
    <div class="overlay ${S.overlayOpen === 'settings' ? 'open' : ''}">
      <div class="overlay-header"><span class="back" data-close-overlay="1">←</span><span>Settings</span></div>
      <div class="overlay-body"><p class="muted" style="font-size:12.5px;">Target window, provider/model — out of this ticket's scope, placeholder only.</p></div>
    </div>`;
}

function fabStackHtml() {
  return `<div class="fab-stack">
    <div class="fab ${fsSupported() ? '' : 'disabled'}" data-fullscreen="1" title="${fsTitle()}">${fsIcon()}</div>
    <div class="fab" data-open-settings="1" title="Settings">⚙</div>
  </div>`;
}

/* ---------- A (rejected) ---------- */
function renderA() {
  const conn = connLabel(), entry = currentDisplayEntry(), isLive = S.paneMode === "live";
  return `<div id="vA">
    <div class="top-bar">
      <span class="pill"><span class="dot ${conn.cls}"></span>${conn.text}</span>
      <span class="icon-btn" data-open-settings="1">⚙</span>
    </div>
    <div class="pane">
      ${answerBlockHtml(entry, { showCursor: isLive, interrupted: !isLive && entry && entry.interrupted })}
      ${!isLive ? `<button class="back-to-live" data-back-live="1">↩ Back to live</button>` : ""}
      ${isLive ? `<div class="always-on-top-note">No pin here — a second open tab or your phone <i>is</i> the always-on-top.</div>` : ""}
    </div>
    <div class="history-tab" data-toggle-sheet="1" style="${S.sheetOpen ? 'display:none' : ''}">
      <span>History (${S.history.length})</span><span>▲</span>
    </div>
    <div class="sheet ${S.sheetOpen ? "open" : ""}">
      <div class="sheet-handle" data-toggle-sheet="1"></div>
      <div class="sheet-header"><span>History</span><span data-toggle-sheet="1" style="cursor:pointer;">▼ close</span></div>
      <div class="sheet-list">${S.history.map(historyRowHtml).join("")}</div>
    </div>
  </div>`;
}

/* ---------- B (rejected) ---------- */
function renderB() {
  const conn = connLabel(), entry = currentDisplayEntry(), isLive = S.paneMode === "live";
  return `<div id="vB">
    <div class="header">
      <span class="dot ${conn.cls}" title="${conn.text}"></span>
      <span class="title-trunc">${entry ? escapeHtml(entry.title) : "Screen Solver"}</span>
      <span class="icon-btn" data-overlay="history">☰</span>
      <span class="icon-btn" data-open-settings="1">⚙</span>
    </div>
    <div class="pane">
      ${answerBlockHtml(entry, { showCursor: isLive, interrupted: !isLive && entry && entry.interrupted })}
      ${!isLive ? `<button class="back-to-live" data-back-live="1">↩ Back to live</button>` : ""}
    </div>
    ${overlaysHtml()}
  </div>`;
}

/* ---------- C: continuous log (PORTRAIT, CHOSEN) ---------- */
function renderC() {
  const conn = socketLabel(), rows = [];
  if (S.socket !== "connected") {
    rows.push(`<div class="conn-banner ${S.socket === 'disconnected' ? 'disconnected' : ''}">
      ${S.socket === 'reconnecting' ? '⟳ reconnecting…' : '⚠ disconnected — showing last known state'}</div>`);
  }
  if (S.live) {
    rows.push(`<div class="entry live">
      <div class="entry-top"><span class="pill"><span class="dot ${conn.cls}"></span>live</span><span class="ts">${S.live.ts}</span></div>
      ${answerBlockHtml(S.live, { showCursor: true, interrupted: false })}
    </div>`);
  }
  S.history.forEach((h, i) => {
    const expanded = S.historyViewIndex === i;
    rows.push(`<div class="entry ${expanded ? '' : 'collapsed'}" data-expand="${i}">
      <div class="entry-top"><span style="font-size:13.5px; font-weight:600;">${escapeHtml(h.title)}${h.interrupted ? '<span class="interrupted-tag">interrupted</span>' : ''}</span><span class="ts">${h.ts}</span></div>
      ${answerBlockHtml(h, { showCursor: false, interrupted: false, showHeading: false })}
    </div>`);
  });
  return `<div id="vC">${rows.join("")}</div>${fabStackHtml()}${overlaysHtml()}`;
}

/* ---------- D: split rail (LANDSCAPE, CHOSEN) ---------- */
function renderD() {
  const conn = connLabel(), entry = currentDisplayEntry(), isLive = S.paneMode === "live";
  const cards = [];
  if (S.live) {
    cards.push(`<div class="rail-card is-live ${isLive ? 'active' : ''}" data-back-live="1">
      <div class="t">${escapeHtml(S.live.title)}</div>
      <div class="m">${S.live.state === 'done' ? 'latest' : S.live.state}</div>
    </div>`);
  }
  S.history.forEach((h, i) => {
    cards.push(`<div class="rail-card ${!isLive && S.historyViewIndex === i ? 'active' : ''}" data-open-history="${i}">
      <div class="t">${escapeHtml(h.title)}</div>
      <div class="m">${h.ts}${h.interrupted ? ' <span class="int-dot">· int.</span>' : ''}</div>
    </div>`);
  });
  return `<div id="vD">
    <div class="rail">
      <div class="rail-top">
        <span class="pill"><span class="dot ${conn.cls}"></span>${S.paneMode === 'history' ? 'history' : (S.socket === 'connected' ? 'live' : S.socket)}</span>
      </div>
      <div class="rail-list">${cards.join("")}</div>
      <div class="rail-footer">
        <span class="icon-btn ${fsSupported() ? '' : 'disabled'}" data-fullscreen="1" title="${fsTitle()}">${fsIcon()}</span>
        <span class="icon-btn" data-open-settings="1" title="Settings">⚙</span>
      </div>
    </div>
    <div class="main">${answerBlockHtml(entry, { showCursor: isLive, interrupted: !isLive && entry && entry.interrupted })}</div>
    ${overlaysHtml()}
  </div>`;
}

/* ---------- E (rejected) ---------- */
function renderE() {
  const conn = connLabel(), entry = currentDisplayEntry(), isLive = S.paneMode === "live";
  if (!entry) return `<div id="vE"><div class="strip"><span class="title-trunc">Screen Solver</span></div><div class="cols"><div class="col-code muted" style="font-size:13px;">No answer yet.</div></div></div>`;
  const parts = partsOf(entry);
  return `<div id="vE">
    <div class="strip">
      <span class="dot ${conn.cls}" title="${conn.text}"></span>
      <span class="title-trunc">${escapeHtml(entry.title)}${!isLive && entry.interrupted ? '<span class="interrupted-tag">interrupted</span>' : ''}</span>
      ${!isLive ? `<span class="icon-btn" data-back-live="1" title="Back to live">↩</span>` : ""}
      <span class="icon-btn" data-overlay="history">☰</span>
      <span class="icon-btn ${fsSupported() ? '' : 'disabled'}" data-fullscreen="1" title="${fsTitle()}">${fsIcon()}</span>
      <span class="icon-btn" data-open-settings="1">⚙</span>
    </div>
    <div class="cols">
      <div class="col-code">
        <div class="col-label">Solution</div>
        ${entry.state === "syncing" ? '<div class="sync-tag">syncing…</div>' : ''}
        ${parts.missing ? `<div class="missing-line"><b>Missing:</b> ${escapeHtml(parts.missing)}</div>` : ''}
        ${codeBlockHtml(entry, parts, isLive)}
      </div>
      <div class="col-prose">
        <div class="col-label">Explanation</div>
        ${proseHtml(entry, parts, isLive) || '<div class="muted" style="font-size:12.5px;">…</div>'}
        ${tailHtml(entry)}
      </div>
    </div>
    ${overlaysHtml()}
  </div>`;
}

/* ---------- F (rejected) ---------- */
function renderF() {
  const conn = connLabel(), cards = [];
  if (S.live) {
    cards.push(`<div class="card live">
      <div class="card-top"><span class="pill" style="padding-left:0;"><span class="dot ${conn.cls}"></span>live</span><span class="ts">${S.live.ts}</span></div>
      ${answerBlockHtml(S.live, { showCursor: true, interrupted: false })}
    </div>`);
  }
  S.history.forEach((h) => {
    cards.push(`<div class="card">
      <div class="card-top"><span class="ts">${h.ts}</span>${h.interrupted ? '<span class="interrupted-tag">interrupted</span>' : ''}</div>
      ${answerBlockHtml(h, { showCursor: false, interrupted: false })}
    </div>`);
  });
  return `<div id="vF">
    <div class="strip-top">
      <span style="font-size:12px; color:var(--text-dim);">← newest · scroll for older →</span>
      <span style="display:flex; gap:4px;">
        <span class="icon-btn ${fsSupported() ? '' : 'disabled'}" data-fullscreen="1" title="${fsTitle()}">${fsIcon()}</span>
        <span class="icon-btn" data-open-settings="1">⚙</span>
      </span>
    </div>
    <div class="film">${cards.join("")}</div>
    ${overlaysHtml()}
  </div>`;
}

/* ---------- top-level render ---------- */
function render() {
  const v = effectiveVariant();

  /* Rotation carries state across two layouts that model selection
     differently. D has an explicit live-vs-history pane; C does not — an
     expanded past entry there is just expanded, the live entry is still
     live. So landing on C, drop the history pane mode but keep which entry
     was open, and it stays open as an expanded card. */
  if (v === "C" && S.paneMode === "history") S.paneMode = "live";

  const frame = document.getElementById("frame");
  const fns = { A: renderA, B: renderB, C: renderC, D: renderD, E: renderE, F: renderF };
  frame.innerHTML = fns[v]();

  const device = document.getElementById("device");
  if (isAuto()) {
    device.className = "auto";
  } else {
    device.className = (LANDSCAPE_VARIANTS.includes(v) ? "landscape " : "portrait ") + (S.wide ? "wide" : "phone");
  }

  document.getElementById("switcher-label").innerHTML = isAuto()
    ? `<b>AUTO</b> — live: <b>${v}</b> <span class="orient">· ${orientationIsLandscape() ? "landscape" : "portrait"} · real viewport</span>`
    : `<b>${v}</b> — ${NAMES[v]} <span class="orient">· ${LANDSCAPE_VARIANTS.includes(v) ? "landscape" : "portrait"} frame</span>`;

  document.getElementById("readout").innerHTML =
    `viewport ${window.innerWidth}×${window.innerHeight}<br>` +
    `orientation: ${orientationIsLandscape() ? "landscape" : "portrait"} (mq says ${mqLandscape.matches ? "landscape" : "portrait"})<br>` +
    `fullscreen: ${isFullscreen() ? "on" : "off"}${fsSupported() ? "" : " (unsupported)"}`;

  document.getElementById("controls").classList.toggle("proto-hidden", !S.protoChromeOpen);
  document.getElementById("switcher").classList.toggle("proto-hidden", !S.protoChromeOpen);

  /* Always-visible state badge. On a phone the controls panel starts
     collapsed, so without this there is no way to tell a genuine detection
     failure from a stale ?variant= in the URL. */
  const toggle = document.getElementById("proto-toggle");
  const arrow = S.protoChromeOpen ? "▾" : "▸";
  if (isAuto()) {
    toggle.textContent = `proto ${arrow} · auto → ${v}`;
    toggle.classList.remove("forced");
  } else {
    toggle.textContent = `proto ${arrow} · FORCED ${v}`;
    toggle.classList.add("forced");
  }

  wireDynamicHandlers();
}

function wireDynamicHandlers() {
  const on = (sel, fn) => document.querySelectorAll(sel).forEach(el => el.onclick = (e) => fn(el, e));
  on("[data-toggle-sheet]", () => { S.sheetOpen = !S.sheetOpen; render(); });
  on("[data-overlay]", (el) => { S.overlayOpen = el.dataset.overlay; render(); });
  on("[data-close-overlay]", () => { S.overlayOpen = null; render(); });
  on("[data-open-settings]", () => { S.overlayOpen = "settings"; render(); });
  on("[data-fullscreen]", () => toggleFullscreen());
  on("[data-open-history]", (el) => {
    S.historyViewIndex = parseInt(el.dataset.openHistory, 10);
    S.paneMode = "history"; S.sheetOpen = false; S.overlayOpen = null; render();
  });
  on("[data-expand]", (el, e) => {
    if (e.target.closest("[data-toggle-wrap]")) return;
    const i = parseInt(el.dataset.expand, 10);
    S.historyViewIndex = S.historyViewIndex === i ? null : i;
    render();
  });
  on("[data-back-live]", () => { S.paneMode = "live"; S.historyViewIndex = null; render(); });
  on("[data-toggle-wrap]", (el, e) => { e.stopPropagation(); S.wrapCode = !S.wrapCode; render(); });
}

/* ---------- live orientation + fullscreen listeners ---------- */
/* Several triggers, all cheap, because a missed one means the layout silently
   stops matching the device. `orientationchange` in particular fires on
   Android before the resize settles, so re-render on the next frame too. */
mqLandscape.addEventListener("change", () => render());
window.addEventListener("resize", () => render());
window.addEventListener("orientationchange", () => {
  render();
  requestAnimationFrame(render);
  setTimeout(render, 250);
});
document.addEventListener("fullscreenchange", () => render());
document.addEventListener("webkitfullscreenchange", () => render());

/* ---------- prototype control panel ---------- */
document.getElementById("proto-toggle").addEventListener("click", () => {
  S.protoChromeOpen = !S.protoChromeOpen; render();
});
document.querySelectorAll("#controls [data-act]").forEach(btn => {
  btn.addEventListener("click", () => {
    const act = btn.dataset.act;
    if (act === "new") { S.demoCursor = (S.demoCursor + 1) % DEMO.length; startAnswer(DEMO[S.demoCursor]); }
    else if (act === "error") simulateError();
    else if (act === "disconnect") { S.socket = "disconnected"; render(); }
    else if (act === "reconnect") { S.socket = "reconnecting"; render(); setTimeout(() => { S.socket = "connected"; render(); }, 1400); }
    else if (act === "sync") { S.demoCursor = (S.demoCursor + 1) % DEMO.length; startAnswer(DEMO[S.demoCursor], { syncFrom: 0.55 }); }
    else if (act === "width") { S.wide = !S.wide; render(); }
    else if (act === "reset") location.reload();
  });
});

/* ---------- variant switcher ---------- */
function setVariant(v) {
  S.mode = v;
  const url = new URL(location.href);
  /* auto clears the param rather than writing ?variant=auto — otherwise the
     URL stays sticky and a later reload silently reopens a forced layout. */
  if (v === "auto") url.searchParams.delete("variant");
  else url.searchParams.set("variant", v);
  history.replaceState(null, "", url);
  render();
}
document.querySelectorAll("#switcher [data-nav]").forEach(btn => {
  btn.addEventListener("click", () => {
    const dir = parseInt(btn.dataset.nav, 10);
    setVariant(ORDER[(ORDER.indexOf(S.mode) + dir + ORDER.length) % ORDER.length]);
  });
});
document.addEventListener("keydown", (e) => {
  const a = document.activeElement;
  if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.isContentEditable)) return;
  if (e.key === "ArrowLeft") document.querySelector('#switcher [data-nav="-1"]').click();
  if (e.key === "ArrowRight") document.querySelector('#switcher [data-nav="1"]').click();
});

/* ---------- boot ---------- */
if (window.innerWidth < 700) S.protoChromeOpen = false;
render();
setTimeout(() => startAnswer(DEMO[2]), 900);
</script>
</body>
</html>
