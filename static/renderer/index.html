<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; media-src 'self' blob:"
    />
    <title>Screen Solver capture host</title>
  </head>
  <body>
    <!--
      The hidden renderer. Never shown to the user.

      This page exists so the host has a DOM to run capture mechanism in
      (#30): desktopCapturer source -> getUserMedia -> canvas -> downscale ->
      encode, handed to main over the IPC surface preload.js exposes as
      window.captureHost. No decision logic runs here -- gating on minimized,
      vanished-from-enumeration, or a black/zero-size frame all live in
      src/host/capture/, run from main. capture.js is plain JavaScript, not
      compiled from TypeScript, per static/ being loaded/served as-is.

      The web client (#33) is a different thing entirely and will be served over
      HTTP from static/client/, not loaded here.
    -->
    <script src="capture.js"></script>
  </body>
</html>
