<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Solver</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Screen Solver</h1>
      <span id="connection-indicator" class="connection-indicator"></span>
      <span id="status-pill" class="status-pill" hidden></span>
      <button id="fullscreen-button" type="button" class="icon-button" title="Fullscreen">&#9974;</button>
      <button id="solve-button" type="button" disabled>Solve now</button>
    </header>

    <div id="target-bar" class="target-bar" hidden>
      <span id="target-label" class="target-label"></span>
      <div id="solve-error" class="error-message" hidden></div>
    </div>

    <main>
      <section id="picker" class="panel" hidden>
        <h2>Pick a window to watch</h2>
        <p class="hint">No target window is configured yet. Pick one of the currently open windows below.</p>
        <div id="picker-error" class="error-message" hidden></div>
        <ul id="window-list" class="window-list"></ul>
        <button id="refresh-windows" type="button">Refresh list</button>
      </section>

      <!--
        Populated entirely from app.js's render() -- which of the two layouts
        (continuous log / split rail) lands here depends on orientation, so
        there is no static markup to give it beyond this mount point. See
        #34 / prototype/21-web-client for why.
      -->
      <section id="entries-root" class="entries-root" hidden></section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
