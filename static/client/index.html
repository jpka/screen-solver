<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Solver</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Screen Solver</h1>
      <span id="connection-indicator" class="connection-indicator"></span>
      <span id="status-pill" class="status-pill" hidden></span>
      <!-- #35 adds two buttons to #34's header, so all four are wrapped:
           the flex layout then needs one auto-margin (on the wrapper) rather
           than relying on auto-margins collapsing correctly across four
           siblings, and the wrapper is what wraps to a second row on a narrow
           phone instead of the buttons overflowing. The two solve buttons stay
           adjacent -- they are the same action with and without speech.
           A third solve button (speech-only, this ticket) joins them for the
           same reason: it needs no screenshot at all, just recent transcript,
           so it starts disabled independently of `#solve-transcript-button`/
           `#solve-button` (see app.js's enabled-ness comment on it) rather
           than sharing their target-gated disabled state. -->
      <div class="header-actions">
        <button id="record-toggle" type="button" data-state="off">Start recording</button>
        <button id="fullscreen-button" type="button" class="icon-button" title="Fullscreen">&#9974;</button>
        <button id="solve-voice-button" type="button" disabled>Solve speech only</button>
        <button id="solve-transcript-button" type="button" disabled>Solve with transcript</button>
        <button id="solve-button" type="button" disabled>Solve now</button>
      </div>
    </header>

    <div id="target-bar" class="target-bar" hidden>
      <span id="target-label" class="target-label"></span>
      <div id="solve-error" class="error-message" hidden></div>
    </div>

    <main>
      <section id="picker" class="panel" hidden>
        <h2>Pick a window to watch</h2>
        <p class="hint">No target window is configured yet. Pick one of the currently open windows below.</p>
        <div id="picker-error" class="error-message" hidden></div>
        <ul id="window-list" class="window-list"></ul>
        <button id="refresh-windows" type="button">Refresh list</button>
      </section>

      <!--
        Populated entirely from app.js's render() -- which of the two layouts
        (continuous log / split rail) lands here depends on orientation, so
        there is no static markup to give it beyond this mount point. See
        #34 / prototype/21-web-client for why.
      -->
      <section id="entries-root" class="entries-root" hidden></section>

      <!-- #35: the running transcript of recorded system audio.
           Deliberately static markup outside #entries-root rather than
           another thing render() draws: it is a continuous log with its own
           scroll position, and re-rendering it on every entry change (or on
           rotation) would throw that scroll position away mid-sentence.
           Hidden until recording has something to say -- see app.js's
           `applyRecording`. -->
      <section id="transcript-pane" class="panel" hidden>
        <h2>Transcript</h2>
        <div id="recording-error" class="error-message" hidden></div>
        <div id="transcript-list" class="transcript-list">
          <!-- Finalized lines (app.js's addTranscriptEntry) are inserted
               just above these two, which stay the last two children always,
               so the "in progress" rows stay pinned at the bottom no matter
               how many finals accumulate above them. One per channel since
               `transcript-interim` replaces wholesale per-channel, not
               globally; `me` is reserved and never populated by today's
               server, but the row exists so it is ready the day it is. -->
          <div id="transcript-interim-them" class="transcript-line transcript-interim" data-channel="them" hidden>
            <span class="transcript-channel">Them:</span><span class="transcript-text"></span>
          </div>
          <div id="transcript-interim-me" class="transcript-line transcript-interim" data-channel="me" hidden>
            <span class="transcript-channel">Me:</span><span class="transcript-text"></span>
          </div>
        </div>
      </section>

      <section id="screen-recording-pane" class="panel">
        <h2>Screen Recording</h2>

        <div class="screen-recording-control-row">
          <button id="screen-rec-button" type="button" disabled>Record</button>
          <span id="screen-rec-state-label" class="hint"></span>
        </div>
        <div id="screen-recording-error" class="error-message" hidden></div>

        <div id="screen-recording-indicator" class="screen-recording-indicator" hidden>
          <span class="screen-rec-dot" aria-hidden="true"></span>
          <span class="screen-recording-indicator-label">REC</span>
          <span id="screen-rec-elapsed"></span>
          <span id="screen-rec-bytes"></span>
        </div>

        <details id="screen-recording-settings">
          <summary>Recording settings</summary>
          <div id="screen-recording-settings-error" class="error-message" hidden></div>
          <form id="screen-recording-settings-form">
            <label class="settings-row settings-row-checkbox">
              <input type="checkbox" id="screen-rec-setting-enabled" />
              Start recording automatically whenever a window is being captured
            </label>
            <label class="settings-row">
              Segment length (seconds)
              <input type="number" id="screen-rec-setting-segment-seconds" min="1" step="1" />
            </label>
            <label class="settings-row">
              Retention size limit (bytes)
              <input type="number" id="screen-rec-setting-retention-bytes" min="0" step="1" />
            </label>
            <label class="settings-row">
              Retention time limit (days)
              <input type="number" id="screen-rec-setting-retention-days" min="0" step="1" />
            </label>
            <div class="settings-row settings-actions">
              <button type="submit" id="rec-settings-save">Save settings</button>
              <span id="screen-rec-settings-status" class="hint" hidden>Saved.</span>
            </div>
          </form>
        </details>

        <div id="screen-recording-player" class="screen-recording-player" hidden></div>

        <div id="screen-recordings-error" class="error-message" hidden></div>
        <ul id="screen-recordings-list" class="screen-recordings-list"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
