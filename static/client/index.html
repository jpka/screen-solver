<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screen Solver</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Screen Solver</h1>
      <span id="status-pill" class="status-pill" hidden></span>
      <button id="solve-button" type="button" disabled>Solve now</button>
    </header>

    <main>
      <section id="picker" class="panel" hidden>
        <h2>Pick a window to watch</h2>
        <p class="hint">No target window is configured yet. Pick one of the currently open windows below.</p>
        <div id="picker-error" class="error-message" hidden></div>
        <ul id="window-list" class="window-list"></ul>
        <button id="refresh-windows" type="button">Refresh list</button>
      </section>

      <section id="answer-pane" class="panel" hidden>
        <h2>Current answer</h2>
        <div id="target-label" class="target-label"></div>
        <div id="solve-error" class="error-message" hidden></div>
        <pre id="answer-text" class="answer-text" data-state="idle">Click &quot;Solve now&quot; to analyze the target window.</pre>
      </section>

      <section id="history-pane" class="panel">
        <h2>History</h2>
        <ul id="history-list" class="history-list"></ul>
      </section>

      <section id="recording-pane" class="panel">
        <h2>Screen Recording</h2>

        <div class="recording-control-row">
          <button id="rec-button" type="button" disabled>Record</button>
          <span id="rec-state-label" class="hint"></span>
        </div>
        <div id="recording-error" class="error-message" hidden></div>

        <div id="recording-indicator" class="recording-indicator" hidden>
          <span class="rec-dot" aria-hidden="true"></span>
          <span class="recording-indicator-label">REC</span>
          <span id="rec-elapsed"></span>
          <span id="rec-bytes"></span>
        </div>

        <details id="recording-settings">
          <summary>Recording settings</summary>
          <div id="recording-settings-error" class="error-message" hidden></div>
          <form id="recording-settings-form">
            <label class="settings-row settings-row-checkbox">
              <input type="checkbox" id="rec-setting-enabled" />
              Start recording automatically whenever a window is being captured
            </label>
            <label class="settings-row">
              Segment length (seconds)
              <input type="number" id="rec-setting-segment-seconds" min="1" step="1" />
            </label>
            <label class="settings-row">
              Retention size limit (bytes)
              <input type="number" id="rec-setting-retention-bytes" min="0" step="1" />
            </label>
            <label class="settings-row">
              Retention time limit (days)
              <input type="number" id="rec-setting-retention-days" min="0" step="1" />
            </label>
            <div class="settings-row settings-actions">
              <button type="submit" id="rec-settings-save">Save settings</button>
              <span id="rec-settings-status" class="hint" hidden>Saved.</span>
            </div>
          </form>
        </details>

        <div id="recording-player" class="recording-player" hidden></div>

        <div id="recordings-error" class="error-message" hidden></div>
        <ul id="recordings-list" class="recordings-list"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
